name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA and agree') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/Kuberve/kernel/blob/main/CLA.md'
          branch: 'main'
          allowlist: bot*,dependabot[bot]
          custom-notsigned-prcomment: |
            Thank you for your contribution!
            
            Before we can review this PR, we need you to sign our
            [Contributor License Agreement (CLA)](https://github.com/Kuberve/kernel/blob/main/CLA.md).
            
            To sign, please reply to this PR with exactly this text:
            
            `I have read the CLA and agree`
            
            The CLA allows the Kuberve project to dual-license your contribution
            under both AGPLv3 and commercial terms. You retain copyright.
          custom-pr-sign-comment: 'I have read the CLA and agree'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. ✅'
          lock-pullrequest-aftermerge: false