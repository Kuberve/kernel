[package]
name = "kuberve"
version = "0.14.5"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Kuberve/kernel"
authors = ["Simonov Zakhar <zaharsimonov6087@gmail.com> (BlackZakha)"]
description = "Kuberve OS kernel — aarch64, no_std, microkernel-inspired"

[[bin]]
name = "kuberve"
path = "src/main.rs"

[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
opt-level = 2

[dependencies]
kuberve-abi = { git = "https://github.com/Kuberve/abi" }